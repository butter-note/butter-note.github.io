name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Sync Notion articles
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_DATA_SOURCE_ID" ]; then
            npm run sync:notion
          else
            echo "Notion article sync skipped: secrets are not configured."
          fi
      - name: Sync Notion templates
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TEMPLATES_DATA_SOURCE_ID: ${{ secrets.NOTION_TEMPLATES_DATA_SOURCE_ID }}
        run: |
          if [ -n "$NOTION_API_KEY" ] && [ -n "$NOTION_TEMPLATES_DATA_SOURCE_ID" ]; then
            npm run sync:notion:templates
          else
            echo "Notion template sync skipped: secrets are not configured."
          fi
      - name: Build static site
        run: npm run build
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
